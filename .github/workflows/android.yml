name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Create the Android project
        run: npx cap add android
      - name: Generate the app icon and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#FF8A73' --iconBackgroundColorDark '#FF8A73' --splashBackgroundColor '#FFFFFF' --splashBackgroundColorDark '#08090B'
      - name: Copy the web app into Android
        run: npx cap sync android
      - name: Use the fixed signing key so updates install over the old app
        run: |
          mkdir -p ~/.android
          cp android-debug.keystore ~/.android/debug.keystore
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Neal-App.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Neal-App-apk
          path: Neal-App.apk
          if-no-files-found: error
