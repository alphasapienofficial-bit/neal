name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Create the Android project
        run: npx cap add android
      - name: Generate the app icon and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#FF8A73' --iconBackgroundColorDark '#FF8A73' --splashBackgroundColor '#FFFFFF' --splashBackgroundColorDark '#08090B'
      - name: Copy the web app into Android
        run: npx cap sync android
      - name: Use the fixed signing key so updates install over the old app
        run: |
          mkdir -p ~/.android
          cp android-debug.keystore ~/.android/debug.keystore
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Neal-App.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Neal-App-apk
          path: Neal-App.apk
          if-no-files-found: error
      - name: Publish the APK as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Neal-App.apk --title "Neal App" --notes "Latest Neal App build. Download Neal-App.apk on your phone to install it."
      - name: Save the APK on the apk branch
        run: |
          mkdir apk-out
          cp Neal-App.apk apk-out/
          cd apk-out
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Neal-App.apk
          git commit -q -m "Latest Neal App APK"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
